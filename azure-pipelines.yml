trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: Usar Python 3.12

- script: |
    python -m pip install --upgrade pip
    pip install ansible-core==2.21.5 ansible-lint
    ansible-galaxy collection install ansible.posix
  displayName: Instalar Ansible y ansible-lint

- script: |
    ansible-playbook -i inventories/hosts.example.ini playbooks/hola.yml --syntax-check
    ansible-playbook -i inventories/hosts.example.ini playbooks/idempotencia.yml --syntax-check
    ansible-playbook -i inventories/hosts.example.ini playbooks/error-permisos.yml --syntax-check
    ansible-playbook -i inventories/hosts.example.ini playbooks/baseline.yml --syntax-check
  displayName: Validar sintaxis de playbooks

- script: |
    ansible-lint playbooks/ roles/
  displayName: Revisar buenas practicas con ansible-lint
